<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f5"><title>10-Minute Room Rescue | The Little Reset Club</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#fff1f4,#fff8e7 48%,#e9f5ff);color:#29283c;min-height:100vh}.wrap{max-width:510px;margin:auto;padding:26px 18px 40px}.brand{text-align:center;font-size:12px;font-weight:800;letter-spacing:2px;color:#685b81}.headline{text-align:center;font-size:30px;line-height:1.13;margin:14px 0 8px}.subtitle{text-align:center;color:#615a6c;margin:0 0 22px}.progress{display:flex;gap:6px;margin:18px 0}.segment{height:10px;flex:1;background:#e9e3e9;border-radius:20px;transition:background .2s}.panel{border-radius:26px;padding:28px 20px;min-height:330px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 35px #6c557318}.eyebrow{font-weight:800;font-size:13px;letter-spacing:.8px}.emoji{font-size:65px;margin:22px 0 8px}.task{font-size:30px;margin:8px 0 14px;line-height:1.1}.detail{font-size:19px;line-height:1.5;max-width:340px}.hint{background:#ffffffb9;padding:9px 16px;border-radius:22px;font-size:13px;font-weight:700;margin-top:20px}.controls{margin-top:17px;display:grid;gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:15px;padding:17px;font-weight:800;font-size:17px}button.primary{background:#53447c;color:white;box-shadow:0 5px 0 #352a52}button:focus-visible{outline:3px solid #191328;outline-offset:3px}.secondary{background:#ffffffb8;color:#544767}.nav{display:flex;gap:10px}.nav button{flex:1;font-size:14px;padding:13px}.timebox{margin-top:16px;text-align:center}.time{font-size:31px;font-variant-numeric:tabular-nums;font-weight:800}.timerbuttons{display:flex;justify-content:center;gap:8px;margin-top:8px}.timerbuttons button{font-size:13px;padding:10px 14px;background:white;color:#4a3e66}.foot{text-align:center;color:#625b6b;font-size:13px;margin-top:22px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="wrap"><div class="brand">🌈 THE LITTLE RESET CLUB</div><h1 class="headline">10-Minute Room Rescue</h1><p class="subtitle">One tiny task at a time. No decisions needed.</p><div class="progress" id="progress" aria-label="Progress"></div><section class="panel" id="panel" aria-live="polite"></section><div class="timebox" id="timebox"><div class="time" id="time">2:00</div><div class="timerbuttons"><button id="timerToggle">▶ Start timer</button><button id="timerReset">↻ Reset timer</button></div></div><div class="controls"><button class="primary" id="next">Done! Next step →</button><div class="nav"><button class="secondary" id="back">← Previous</button><button class="secondary" id="skip">Skip for now →</button></div></div><p class="foot">Progress counts, even if you don't finish. 💛</p></main><script>const steps=[{title:'Rubbish first!',desc:'Grab a bag. Pick up any obvious rubbish.',emoji:'🗑️',bg:'#ffdee5',ink:'#96394f'},{title:'Rescue the dishes',desc:'Gather cups and plates in one place. No washing needed.',emoji:'🍽️',bg:'#ffe7c7',ink:'#865121'},{title:'Clothes in one place',desc:'Put loose clothes into a basket or one pile.',emoji:'👕',bg:'#fff0b5',ink:'#776016'},{title:'Clear one surface',desc:'Choose one table, desk or counter. Just one.',emoji:'✨',bg:'#daf2dc',ink:'#336b43'},{title:'Five things home',desc:'Put away five things. That’s it!',emoji:'🏡',bg:'#e4e1ff',ink:'#51438a'}];let step=0,seconds=120,interval=null;const $=id=>document.getElementById(id);function pause(){if(interval){clearInterval(interval);interval=null} $('timerToggle').textContent='▶ Start timer'}function updateTime(){$('time').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}function resetTimer(){pause();seconds=120;updateTime()}function render(){const finished=step===5;$('progress').innerHTML=steps.map((s,i)=>'<div class="segment" style="background:'+(i<=step?s.ink:'#e9e3e9')+'"></div>').join('');$('progress').setAttribute('aria-label',step+' of 5 tasks complete');if(finished){$('panel').style.background='#dcf5e6';$('panel').innerHTML='<div class="emoji">🎉🌈</div><h2 class="task">You did it!</h2><p class="detail">Five little wins. Your room doesn’t need to be perfect.</p><div class="hint">You can stop here. Really.</div>';$('next').textContent='↻ Start another rescue';$('timebox').hidden=true;$('skip').hidden=true;$('back').hidden=true}else{const s=steps[step];$('panel').style.background=s.bg;$('panel').innerHTML='<div class="eyebrow" style="color:'+s.ink+'">STEP '+(step+1)+' OF 5 · 2 MINUTES</div><div class="emoji">'+s.emoji+'</div><h2 class="task">'+s.title+'</h2><p class="detail">'+s.desc+'</p><div class="hint" style="color:'+s.ink+'">Only this task matters right now</div>';$('next').textContent='Done! Next step →';$('timebox').hidden=false;$('skip').hidden=false;$('back').hidden=step===0}resetTimer()}function move(n){step=Math.max(0,Math.min(5,n));render()}$('next').onclick=()=>move(step===5?0:step+1);$('skip').onclick=()=>move(step+1);$('back').onclick=()=>move(step-1);$('timerReset').onclick=resetTimer;$('timerToggle').onclick=()=>{if(interval){pause();return} $('timerToggle').textContent='Ⅱ Pause timer';interval=setInterval(()=>{if(seconds>0){seconds--;updateTime()}if(seconds===0){pause();$('timerToggle').textContent='Time’s up — move on when ready'}},1000)};render();</script></body></html>
